name: Публикация демонстрации на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Получение файлов
        uses: actions/checkout@v4
      - name: Настройка GitHub Pages
        uses: actions/configure-pages@v5
      - name: Подготовка статичного сайта
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Публикация
        id: deployment
        uses: actions/deploy-pages@v4
